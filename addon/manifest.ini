name = teamsChat
summary = "Teams Chat: lectura rápida de mensajes"
description = """Mejoras para el nuevo Microsoft Teams de escritorio. Alt+0 a Alt+9 (fila superior o teclado numérico) leen los últimos mensajes del chat abierto: 0 es el último. Pulsar dos veces copia el mensaje. NVDA+Alt+0 a 9 abren el menú de opciones del mensaje."""
